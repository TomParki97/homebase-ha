add_chore:
  name: Add chore
  description: Add a new chore to HomeBase.
  fields:
    name:
      name: Name
      description: Name of the chore.
      required: true
      selector:
        text:
    description:
      name: Description
      description: Optional details about the chore.
      selector:
        text:
          multiline: true
    area:
      name: Area
      description: Area of the home associated with the chore.
      selector:
        text:
    assignee:
      name: Assignee
      description: Person responsible for the chore.
      selector:
        text:

complete_chore:
  name: Complete chore
  description: Mark a HomeBase chore as completed.
  fields:
    chore_id:
      name: Chore ID
      description: Unique ID of the chore to complete.
      required: true
      selector:
        text:
    completed_by:
      name: Completed by
      description: Person who completed the chore.
      selector:
        text:
    note:
      name: Note
      description: Optional note about this completion.
      selector:
        text:
          multiline: true

remove_chore:
  name: Remove chore
  description: Permanently remove a chore from HomeBase.
  fields:
    chore_id:
      name: Chore ID
      description: Unique ID of the chore to remove.
      required: true
      selector:
        text:
